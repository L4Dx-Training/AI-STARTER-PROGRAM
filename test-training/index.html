<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A sample static website hosted on Amazon S3.">
  <title>My AWS Sample App</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; color: #172033; }
    main { width: min(640px, calc(100% - 40px)); padding: 40px; box-sizing: border-box; background: white; border-radius: 16px; box-shadow: 0 12px 36px #17203318; }
    h1 { margin-top: 0; color: #075985; }
    p { line-height: 1.6; }
    .status { display: inline-block; padding: 8px 12px; border-radius: 999px; background: #dcfce7; color: #166534; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <span class="status">Sample app ready</span>
    <h1>Hello from Amazon S3!</h1>
    <p>This sample static website is served directly from an Amazon S3 bucket website endpoint.</p>
    <p>Update <code>index.html</code> in the GitHub project and redeploy to publish your changes.</p>
  </main>
</body>
</html>
